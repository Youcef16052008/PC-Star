name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  create_neon_branch:
    name: Create Neon Branch
    outputs:
      db_url: ${{ steps.create_neon_branch.outputs.db_url }}
      db_url_pooled: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    # Identifiants de fixture, valables seulement dans la branche Neon éphémère
    # créée ci-dessous. Ils ne sont ni les secrets Vercel ni un accès production.
    env:
      MASTER_EMAIL: master-ci@test.pcstar.local
      MASTER_PASSWORD: ci-master-password-not-for-production
      DEMO_PASSWORD: ci-demo-password-not-for-production
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # LOT 1.20 (17/09/2026) : jsdom 30 (via undici embarqué) exige Node 22 —
          # sous Node 20 la moitié de la suite (tout ce qui rend du JSX) crashe en
          # `webidl.util.markAsUncloneable is not a function`. La suite est
          # développée et validée sous Node 22.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # LOT 1.20 — ces étapes n'ont PAS besoin de MASTER_EMAIL / MASTER_PASSWORD,
      # et le workflow ne les pose donc pas : elles créent un schéma, vérifient un
      # verrou de concurrence et lancent la suite — aucune n'ouvre de session. Le
      # secret maître de production n'a rien à faire dans un dépôt public (R1/R12).
      # C'est `server/db.js` qui ne doit plus exiger ces variables à l'import :
      # voir docs/NEON-MIGRATION.md et docs/PLAN-CORRECTIONS.md §9 « chantier 1.B ».
      - name: Run Neon schema migrations
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
        run: npm run db:migrate:neon
      - name: Verify Neon concurrent reservation protection
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
          PCSTAR_NEON_TEST_ISOLATED: '1'
        run: npm run test:neon:concurrency
      - name: Verify Neon backup and restoration
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
          PCSTAR_NEON_TEST_ISOLATED: '1'
        run: npm run test:neon:backup
      - name: Reset isolated Neon state before full suite
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
        run: npm run db:migrate:neon:reset
      - name: Run full isolated regression suite
        # `scripts/test-env.mjs` intentionally pins DATABASE_URL empty: unit and
        # HTTP tests keep their filesystem fixture isolation. The two preceding
        # steps are the real Neon integration gates and fail this workflow on a
        # migration, transaction, backup or restore failure.
        run: npm test

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
