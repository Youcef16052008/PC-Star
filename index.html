<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Thème : le client a supprimé le thème sombre — le site est
      // définitivement en thème clair (carte de visite : blanc/bleu/rouge).
      ;(function () {
        try {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#f4f6fb')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PC Star Informatique — pièces PC, config, réparation. Retrait El Makari Les Castors, Oran. Paiement espèces." />
    <meta name="theme-color" content="#f4f6fb" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PC Star Informatique — Oran" />
    <meta property="og:description" content="Pièces PC, config, réparation. Retrait El Makari Les Castors. Espèces au comptoir." />
    <meta property="og:locale" content="fr_DZ" />
    <meta name="twitter:card" content="summary" />
    <title>PC Star Informatique — Oran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Polices : Inter (UI/corps/titres) + JetBrains Mono (données) ;
         Cairo / Noto Naskh Arabic pour les glyphes arabes. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Cairo:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Bootstrap CSS : en bundle via main.jsx (P4/B17) — plus de CDN -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
